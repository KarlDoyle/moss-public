name: ci

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` here on purpose: packageManager in package.json is the single
      # source of truth, and action-setup fails outright if both are set.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit + import-boundary + secret-scan + docs-surface)
        run: pnpm test

      - name: CLI smoke — help
        run: pnpm exec tsx ./src/cli.ts --help

      - name: CLI smoke — version
        run: pnpm exec tsx ./src/cli.ts --version

      - name: CLI smoke — doctor --json
        run: pnpm exec tsx ./src/cli.ts doctor --json

      - name: CLI smoke — skills
        run: pnpm exec tsx ./src/cli.ts skills
